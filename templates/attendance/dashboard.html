{% extends "base.html" %}
{% block title %}Attendance Dashboard{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Attendance Dashboard</h2>
    <a href="{{ url_for('mark_attendance') }}" class="btn btn-primary">
        <i class="bi bi-check2-square"></i> Mark Attendance
    </a>
</div>

<p class="text-muted">Today: <strong>{{ today }}</strong></p>

<div class="row g-3 mb-4">
    <div class="col-md-3">
        <div class="card stat-card" style="border-left-color: #3b82f6;">
            <div class="card-body">
                <h6 class="text-muted">Records Today</h6>
                <h2>{{ today_records }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card stat-card" style="border-left-color: #10b981;">
            <div class="card-body">
                <h6 class="text-muted">Present</h6>
                <h2>{{ present }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card stat-card" style="border-left-color: #ef4444;">
            <div class="card-body">
                <h6 class="text-muted">Absent</h6>
                <h2>{{ absent }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card stat-card" style="border-left-color: #f59e0b;">
            <div class="card-body">
                <h6 class="text-muted">Late</h6>
                <h2>{{ late }}</h2>
            </div>
        </div>
    </div>
</div>

<a href="{{ url_for('attendance_list') }}" class="btn btn-outline-primary">View Full Attendance List</a>
{% endblock %}
